<!DOCTYPE html>
<html>
<head>
    <title>Cancel Booking - Hotel Sugam ERP</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        .main {
            margin-left: 230px;
            padding: 40px;
        }

        .box {
            max-width: 550px;
            background: white;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        h1 {
            color: #dc2626;
            margin-top: 0;
        }

        .details {
            background: #f9fafb;
            padding: 20px;
            margin: 20px 0;
            border-radius: 6px;
        }

        .warning {
            color: #991b1b;
            margin-bottom: 20px;
        }

        .cancel-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }

        .back-btn {
            background: #6b7280;
            color: white;
            padding: 12px 20px;
            border-radius: 5px;
            text-decoration: none;
            margin-left: 8px;
        }
    </style>
</head>

<body>

<div class="main">

    <div class="box">

        <h1>⚠️ Cancel Booking</h1>

        <p class="warning">
            Are you sure you want to cancel this booking?
        </p>

        <div class="details">

            <p>
                <strong>Guest:</strong>
                {{ booking.guest.name }}
            </p>

            <p>
                <strong>Room:</strong>
                Room {{ booking.room.room_number }}
            </p>

            <p>
                <strong>Check-in:</strong>
                {{ booking.check_in }}
            </p>

            <p>
                <strong>Check-out:</strong>
                {{ booking.check_out }}
            </p>

            <p>
                <strong>Status:</strong>
                {{ booking.status }}
            </p>

        </div>

        <form method="POST">

            {% csrf_token %}

            <button type="submit" class="cancel-btn">
                Yes, Cancel Booking
            </button>

            <a href="{% url 'bookings' %}" class="back-btn">
                Go Back
            </a>

        </form>

    </div>

</div>

</body>
</html>
